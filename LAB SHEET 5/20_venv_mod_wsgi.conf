# Apache mod_wsgi configuration fragment for a project virtual environment.
# Replace these paths with the deployment's absolute paths. The virtualenv's
# Python version must match the Python version used to build mod_wsgi.
WSGIPythonHome "C:/path/to/project/.venv"
WSGIScriptAlias /python-web "C:/path/to/project/LAB SHEET 5/20_wsgi_app.wsgi"

<Directory "C:/path/to/project/LAB SHEET 5">
    Require all granted
</Directory>
